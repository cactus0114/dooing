<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="metaTheme" content="#1f6f5c">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>나의 할 일</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --chip: #f2f3f2;
  --fg: #1c2421;
  --muted: #667570;
  --line: #e4e7e5;
  --accent: #1f6f5c;
  --accent-fg: #ffffff;
  --danger: #b3382c;
  --sat: #1a73e8;
  --sun: #e5484d;
  --font: sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1a211f; --chip: #26302d; --fg: #e8ede9; --muted: #98a59f;
    --line: #2b3633; --accent: #5cc4a6; --accent-fg: #0d1a15; --danger: #ee8b7f;
    --sat: #6fa8ff; --sun: #ff8b8b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font-family: var(--font); font-size: inherit; color: inherit; }
button { cursor: pointer; }
input[type="text"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; min-width: 0; width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.banner { background: var(--danger); color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0; }

header { display: flex; flex-direction: column; gap: 14px; }
.toprow, .toprow2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ttl { min-width: 0; }
.sub { margin: 0; font-size: 13px; color: var(--muted); }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.navs { display: flex; gap: 8px; flex: none; }
.nav {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); font-size: 22px; line-height: 1; padding: 0 0 3px;
}
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; }

.cats { display: flex; flex-direction: column; gap: 22px; }
.cat { display: flex; flex-direction: column; gap: 6px; }
.cat-head { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; padding: 4px 4px 4px 16px; }
.cname { background: none; border: 0; padding: 6px 6px 6px 0; font-weight: 700; font-size: 17px; color: var(--fg); }
.plus {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
  font-size: 24px; line-height: 1; padding: 0 0 3px;
}
.ccount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.todos { list-style: none; margin: 0; padding: 0; }
.todos li { display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.todos input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
  border: 2px solid var(--muted); border-radius: 6px; cursor: pointer; display: grid; place-items: center;
}
.todos input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.todos input[type="checkbox"]:checked::after {
  content: ""; width: 5px; height: 10px; border: solid var(--accent-fg); border-width: 0 2px 2px 0;
  transform: translateY(-1px) rotate(45deg);
}
.body { flex: 1; min-width: 0; }
.text { width: 100%; background: none; border: 0; padding: 4px 0; text-align: left; overflow-wrap: anywhere; cursor: text; }
li.done .text { color: var(--muted); text-decoration: line-through; }
.del { flex: none; background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
.del:hover { color: var(--danger); }
.addform { display: flex; gap: 8px; padding: 8px 0 0; }
.mini { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 0 16px; flex: none; }
.mini.ghost { background: var(--chip); color: var(--fg); }
.addcat {
  align-self: flex-start; background: transparent; border: 1px dashed var(--muted); color: var(--muted);
  border-radius: 999px; padding: 8px 18px;
}
.empty { margin: 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 6px; }
.dows { margin-bottom: 4px; }
.dow { text-align: center; font-size: 14px; padding: 6px 0; }
.sat { color: var(--sat); }
.sun { color: var(--sun); }
.cell { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cell.sel { box-shadow: 0 0 0 2px var(--accent) inset; border-radius: 12px; }
.circle {
  width: 36px; height: 36px; border-radius: 50%; background: var(--chip);
  display: grid; place-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.circle.big { width: 44px; height: 44px; font-size: 16px; }
.num { min-width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.num.today { background: var(--fg); color: var(--bg); font-weight: 700; }
.summary { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
.daytitle { margin: 18px 0 14px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 18px; }

.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; align-self: flex-start; }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 20;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface);
  border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p, .sheet label, .sheet .hint { margin: 0; font-size: 14px; color: var(--muted); }
.sheet .hint { font-size: 13px; }
.sheet .cname.prev { align-self: flex-start; background: var(--chip); border-radius: 999px; padding: 6px 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.sw.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--surface) inset; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button { background: var(--chip); border: 0; border-radius: 8px; padding: 10px 16px; }
.btns .primary { background: var(--accent); color: var(--accent-fg); }
.btns .danger { color: var(--danger); }
.delbox { display: flex; flex-direction: column; gap: 10px; }
textarea { min-height: 90px; font-size: 13px; resize: vertical; }
.msg { min-height: 1.4em; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px);
}
.demo-chk {
  width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none;
}
.demo-chk::after {
  content: ""; width: 6px; height: 11px; border: solid currentColor; border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg);
}
</style>
</head><body>

<div class="wrap">
  <p class="banner" id="banner" role="alert" hidden>이 브라우저는 저장을 막고 있습니다. 지금 입력한 내용은 창을 닫으면 사라집니다.</p>
  <div id="app"></div>
  <button class="link" type="button" id="openSettings">설정과 백업</button>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var KEY = 'my-todo-v2';
  var PRESETS = ['#1f6f5c', '#ef4444', '#f97316', '#f59e0b', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#6b7573', '#1c2421'];
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var fmt = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  var todayStr = function () { return fmt(new Date()); };
  var addD = function (s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  var dow = function (s) { return (parse(s).getDay() + 6) % 7; };
  var weekStart = function (s) { return addD(s, -dow(s)); };
  var short = function (s) { var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ')'; };
  var addM = function (s, n) {
    var d = parse(s), day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
    var last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last));
    return fmt(t);
  };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var okColor = function (c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#1f6f5c'; };
  var okDate = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : ''; };
  function textOn(hex) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#1c2421' : '#ffffff';
  }
  function applyTheme(accent) {
    var c = okColor(accent || '#1f6f5c');
    document.documentElement.style.setProperty('--accent', c);
    document.documentElement.style.setProperty('--accent-fg', textOn(c));
    var m = $('metaTheme');
    if (m) m.setAttribute('content', c);
  }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'value' || k === 'checked') el[k] = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    Array.prototype.slice.call(arguments, 2).forEach(function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add);
      else el.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
    return el;
  }

  function sanitize(o) {
    if (!o || !Array.isArray(o.cats) || !Array.isArray(o.todos)) return null;
    var cats = o.cats.filter(function (c) { return c && c.id && typeof c.name === 'string'; }).map(function (c) {
      return { id: String(c.id), name: c.name.slice(0, 20), color: okColor(c.color), start: okDate(c.start), end: okDate(c.end) };
    });
    var ids = {}; cats.forEach(function (c) { ids[c.id] = 1; });
    var todos = o.todos.filter(function (t) {
      return t && typeof t.text === 'string' && ids[String(t.cat)] && okDate(t.date);
    }).map(function (t) {
      return { id: String(t.id || uid()), cat: String(t.cat), date: t.date, text: t.text.slice(0, 200), done: !!t.done };
    });
    var s = o.settings || {};
    return { v: 2, cats: cats, todos: todos, settings: {
      pastColor: okColor(s.pastColor || '#3f9b84'),
      accentColor: okColor(s.accentColor || '#1f6f5c'),
      lastBackup: typeof s.lastBackup === 'string' ? okDate(s.lastBackup) : ''
    } };
  }
  function seed() {
    var t = todayStr();
    var cats = [
      { id: uid() + 'a', name: '생활', color: '#e8806f', start: '', end: '' },
      { id: uid() + 'b', name: '파판', color: '#3fb0ba', start: '', end: '' },
      { id: uid() + 'c', name: '기타 취미', color: '#7fae78', start: '', end: '' },
      { id: uid() + 'd', name: '체중 카운트', color: '#4f7f45', start: '', end: '' }
    ];
    return { v: 2, cats: cats, todos: [
      { id: uid() + 'x', cat: cats[0].id, date: t, text: '예시: 글자를 누르면 수정, ×를 누르면 삭제', done: false },
      { id: uid() + 'y', cat: cats[1].id, date: t, text: '예시: 체크하면 월간 달력에 개수로 표시', done: true }
    ], settings: { pastColor: '#3f9b84', accentColor: '#1f6f5c', lastBackup: '' } };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) {}
    return null;
  }
  var S = load() || seed();
  applyTheme(S.settings.accentColor);

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); $('banner').hidden = true; }
    catch (e) { $('banner').hidden = false; }
  }
  try { if (navigator.storage && navigator.storage.persist) Promise.resolve(navigator.storage.persist()).catch(function () {}); } catch (e) {}

  function catVisible(c, date) { return (!c.start || date >= c.start) && (!c.end || date < c.end); }
  function doneCounts() {
    var cm = {}, out = {};
    S.cats.forEach(function (c) { cm[c.id] = c; });
    S.todos.forEach(function (t) {
      var c = cm[t.cat];
      if (t.done && c && catVisible(c, t.date)) out[t.date] = (out[t.date] || 0) + 1;
    });
    return out;
  }

  var view = 'week', cursor = todayStr(), adding = null, focusAdd = false;

  function periodTitle() {
    var d = parse(cursor);
    if (view === 'day') return { sub: d.getFullYear() + '년', title: (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAYS[d.getDay()] + '요일' };
    if (view === 'week') {
      var s = parse(weekStart(cursor)), e = parse(addD(weekStart(cursor), 6));
      return { sub: s.getFullYear() + '년', title: (s.getMonth() + 1) + '월 ' + s.getDate() + '일 – ' + (s.getMonth() === e.getMonth() ? '' : (e.getMonth() + 1) + '월 ') + e.getDate() + '일' };
    }
    return { sub: '', title: d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월' };
  }
  function step(n) {
    cursor = view === 'day' ? addD(cursor, n) : view === 'week' ? addD(cursor, 7 * n) : addM(cursor, n);
    adding = null; render();
  }
  function isCurrent() {
    var t = todayStr();
    if (view === 'day') return cursor === t;
    if (view === 'week') return weekStart(cursor) === weekStart(t);
    return cursor.slice(0, 7) === t.slice(0, 7);
  }

  function header() {
    var p = periodTitle();
    var tabs = [['day', '일간'], ['week', '주간'], ['month', '월간']].map(function (x) {
      return h('button', { type: 'button', role: 'tab', 'aria-selected': String(view === x[0]),
        onclick: function () { view = x[0]; adding = null; render(); } }, x[1]);
    });
    return h('header', null,
      h('div', { class: 'toprow' },
        h('div', { class: 'ttl' }, p.sub ? h('p', { class: 'sub' }, p.sub) : null, h('h1', null, p.title)),
        h('div', { class: 'navs' },
          h('button', { class: 'nav', type: 'button', 'aria-label': '이전', onclick: function () { step(-1); } }, '‹'),
          h('button', { class: 'nav', type: 'button', 'aria-label': '다음', onclick: function () { step(1); } }, '›'))),
      h('div', { class: 'toprow2' },
        h('div', { class: 'seg', role: 'tablist' }, tabs),
        isCurrent() ? null : h('button', { class: 'chip', type: 'button', onclick: function () { cursor = todayStr(); adding = null; render(); } }, '오늘')));
  }

  function toast(m) {
    var el = $('toast'); el.textContent = m; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function closeSheet() { $('sheetRoot').textContent = ''; }
  function openSheet(children, focusEl) {
    var root = $('sheetRoot'); root.textContent = '';
    var ov = h('div', { class: 'overlay', onclick: function (e) { if (e.target === ov) closeSheet(); } },
      h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, children));
    root.append(ov);
    if (focusEl) focusEl.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function textBtn(t) {
    return h('button', { class: 'text', type: 'button', title: '눌러서 수정·날짜 변경', onclick: function () { openTodoSheet(t); } }, t.text);
  }
  function todoRow(t) {
    return h('li', { class: t.done ? 'done' : '' },
      h('input', { type: 'checkbox', checked: t.done, 'aria-label': '완료 표시',
        onchange: function (e) { t.done = e.target.checked; persist(); render(); } }),
      h('div', { class: 'body' }, textBtn(t)),
      h('button', { class: 'del', type: 'button', 'aria-label': '삭제',
        onclick: function () { S.todos = S.todos.filter(function (x) { return x.id !== t.id; }); persist(); render(); } }, '×'));
  }
  function catBlock(c) {
    var items = S.todos.filter(function (t) { return t.cat === c.id && t.date === cursor; });
    var doneN = items.filter(function (t) { return t.done; }).length;
    var pill = h('div', { class: 'pill' },
      h('button', { class: 'cname', type: 'button', style: 'color:' + c.color, 'aria-label': c.name + ' 편집', onclick: function () { openCatSheet(c); } }, c.name),
      h('button', { class: 'plus', type: 'button', 'aria-label': c.name + '에 할 일 추가',
        onclick: function () { adding = c.id; focusAdd = true; render(); } }, '+'));
    var block = h('section', { class: 'cat' },
      h('div', { class: 'cat-head' }, pill, items.length ? h('span', { class: 'ccount' }, doneN + '/' + items.length) : null),
      h('ul', { class: 'todos' }, items.map(todoRow)));
    if (adding === c.id) {
      var inp = h('input', { type: 'text', class: 'add-input', maxlength: '200', placeholder: '할 일 입력', 'aria-label': c.name + ' 새 할 일' });
      var submitAdd = function () {
        var v = inp.value.trim();
        if (!v) return;
        S.todos.push({ id: uid(), cat: c.id, date: cursor, text: v, done: false });
        persist(); focusAdd = true; render();
      };
      var form = h('div', { class: 'addform' }, inp,
        h('button', { type: 'button', class: 'mini', onclick: submitAdd }, '추가'),
        h('button', { type: 'button', class: 'mini ghost', onclick: function () { adding = null; render(); } }, '닫기'));
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { adding = null; render(); }
        else if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); setTimeout(submitAdd, 0); }
      });
      block.append(form);
    }
    return block;
  }
  function renderDay() {
    var cats = S.cats.filter(function (c) { return catVisible(c, cursor); });
    return h('div', { class: 'cats' },
      cats.map(catBlock),
      cats.length ? null : h('p', { class: 'empty' }, '이 날짜에는 카테고리가 없습니다. 아래에서 추가해 보세요.'),
      h('button', { class: 'addcat', type: 'button', onclick: function () { openCatSheet(null); } }, '+ 카테고리 추가'));
  }
  function dayCell(ds, counts, big) {
    var n = counts[ds] || 0, t = todayStr(), w = dow(ds);
    var circle = h('span', { class: 'circle' + (big ? ' big' : '') }, n > 0 ? String(n) : '');
    if (ds < t) { circle.style.background = S.settings.pastColor; circle.style.color = textOn(S.settings.pastColor); }
    var num = h('span', { class: 'num' + (w === 5 ? ' sat' : '') + (w === 6 ? ' sun' : '') + (ds === t ? ' today' : '') }, String(parse(ds).getDate()));
    var d = parse(ds);
    return h('button', { class: 'cell' + (big && ds === cursor ? ' sel' : ''), type: 'button', 'aria-label': (d.getMonth() + 1) + '월 ' + d.getDate() + '일, 완료 ' + n + '개',
      onclick: function () { cursor = ds; if (!big) view = 'day'; adding = null; render(); } }, circle, num);
  }
  function dowRow() {
    return h('div', { class: 'grid dows' }, ['월', '화', '수', '목', '금', '토', '일'].map(function (l, i) {
      return h('span', { class: 'dow' + (i === 5 ? ' sat' : '') + (i === 6 ? ' sun' : '') }, l);
    }));
  }
  function renderMonth() {
    var counts = doneCounts(), prefix = cursor.slice(0, 8), first = prefix + '01';
    var d = parse(first), n = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    var cells = [], total = 0, i, ds;
    for (i = 0; i < dow(first); i++) cells.push(h('span'));
    for (i = 1; i <= n; i++) { ds = prefix + pad(i); total += counts[ds] || 0; cells.push(dayCell(ds, counts, false)); }
    return h('div', null, dowRow(), h('div', { class: 'grid' }, cells), h('p', { class: 'summary' }, '이 달에 완료한 할 일 ' + total + '개'));
  }
  function renderWeek() {
    var counts = doneCounts(), s = weekStart(cursor), cells = [], total = 0;
    for (var i = 0; i < 7; i++) { var ds = addD(s, i); total += counts[ds] || 0; cells.push(dayCell(ds, counts, true)); }
    var cd = parse(cursor);
    return h('div', null, dowRow(), h('div', { class: 'grid' }, cells),
      h('p', { class: 'summary' }, '이 주에 완료한 할 일 ' + total + '개'),
      h('h2', { class: 'daytitle' }, (cd.getMonth() + 1) + '월 ' + cd.getDate() + '일 ' + DAYS[cd.getDay()] + '요일'),
      renderDay());
  }
  function render() {
    var app = $('app');
    app.textContent = '';
    app.append(header(), h('div', { style: 'height:20px' }), view === 'day' ? renderDay() : view === 'week' ? renderWeek() : renderMonth());
    if (focusAdd) { focusAdd = false; var i = app.querySelector('.add-input'); if (i) i.focus(); }
  }

  function colorField(initial, onChange) {
    var cur = initial;
    var picker = h('input', { type: 'color', value: initial, 'aria-label': '색 직접 고르기', style: 'width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none' });
    var btns = PRESETS.map(function (c) {
      return h('button', { type: 'button', class: 'sw', style: 'background:' + c, 'aria-label': '색 ' + c,
        onclick: function () { cur = c; picker.value = c; mark(); onChange(c); } });
    });
    function mark() { btns.forEach(function (b, i) { b.classList.toggle('on', PRESETS[i].toLowerCase() === cur.toLowerCase()); }); }
    picker.addEventListener('input', function () { cur = picker.value; mark(); onChange(cur); });
    mark();
    return h('div', { class: 'swatches' }, btns, picker);
  }

  function openCatSheet(c) {
    var color = c ? c.color : PRESETS[0];
    var name = h('input', { type: 'text', id: 'catName', maxlength: '20', value: c ? c.name : '', placeholder: '예: 운동' });
    var prev = h('span', { class: 'cname prev' }, c ? c.name : '미리보기');
    function upd() { prev.textContent = name.value.trim() || '미리보기'; prev.style.color = color; }
    name.addEventListener('input', upd);
    var cf = colorField(color, function (v) { color = v; upd(); });
    upd();
    var msg = h('p', { class: 'msg', role: 'status' });
    function saveCat() {
      var v = name.value.trim();
      if (!v) { msg.textContent = '이름을 입력해 주세요.'; return; }
      if (c) { c.name = v; c.color = color; }
      else S.cats.push({ id: uid(), name: v, color: color, start: cursor, end: '' });
      persist(); closeSheet(); render();
    }
    name.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); setTimeout(saveCat, 0); }
    });
    var btns = h('div', { class: 'btns' },
      h('button', { type: 'button', class: 'primary', onclick: saveCat }, '저장'),
      h('button', { type: 'button', onclick: closeSheet }, '취소'));
    var delBox = h('div', { class: 'delbox' });
    if (c) {
      var del = h('button', { type: 'button', class: 'danger' }, '삭제');
      del.addEventListener('click', function () {
        del.hidden = true;
        var d = parse(cursor), label = cursor === todayStr() ? '오늘' : (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
        var cnt = S.todos.filter(function (t) { return t.cat === c.id; }).length;
        var fromBtn = h('button', { type: 'button', class: 'danger', onclick: function () {
          c.end = cursor;
          S.todos = S.todos.filter(function (t) { return !(t.cat === c.id && t.date >= cursor); });
          persist(); closeSheet(); render(); toast(label + '부터 삭제했어요');
        } }, label + '부터 삭제 (이전 기록은 유지)');
        var armed = false;
        var allBtn = h('button', { type: 'button', class: 'danger', onclick: function () {
          if (!armed) { armed = true; allBtn.textContent = '정말 전부 삭제 (할 일 ' + cnt + '개 포함)'; return; }
          S.cats = S.cats.filter(function (x) { return x.id !== c.id; });
          S.todos = S.todos.filter(function (t) { return t.cat !== c.id; });
          persist(); closeSheet(); render(); toast('전부 삭제했어요');
        } }, '이전 기록까지 전부 삭제');
        delBox.append(h('p', null, '어떻게 삭제할까요?'), h('div', { class: 'btns' }, fromBtn, allBtn));
      });
      btns.append(del);
    }
    openSheet([h('h2', null, c ? '카테고리 편집' : '새 카테고리'), h('label', { for: 'catName' }, '이름'), name, h('label', null, '글자색'), cf, prev, msg, btns, delBox], name);
  }

  function openTodoSheet(t) {
    var c = S.cats.filter(function (x) { return x.id === t.cat; })[0];
    var inp = h('input', { type: 'text', maxlength: '200', value: t.text, 'aria-label': '할 일 내용' });
    var msg = h('p', { class: 'msg', role: 'status' });
    function applyText() { var v = inp.value.trim(); if (v) t.text = v; }
    function saveClose() { applyText(); persist(); closeSheet(); render(); }
    function moveTo(ds) {
      if (ds === t.date) { saveClose(); return; }
      if (c && !catVisible(c, ds)) { msg.textContent = '이 카테고리는 ' + short(ds) + '에는 없어서 옮길 수 없어요.'; return; }
      applyText(); t.date = ds; persist(); closeSheet(); render(); toast('옮겼어요 · ' + short(ds));
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); setTimeout(saveClose, 0); }
    });
    var now = todayStr(), tomorrow = addD(now, 1);
    var quick = t.date === now
      ? h('button', { type: 'button', onclick: function () { moveTo(tomorrow); } }, '내일로 (' + short(tomorrow) + ')')
      : h('button', { type: 'button', onclick: function () { moveTo(now); } }, '오늘로 (' + short(now) + ')');
    openSheet([
      h('h2', null, '할 일'),
      inp,
      h('p', null, (c ? c.name + ' · ' : '') + short(t.date)),
      h('div', { class: 'btns' }, quick),
      msg,
      h('div', { class: 'btns' },
        h('button', { type: 'button', class: 'primary', onclick: saveClose }, '저장'),
        h('button', { type: 'button', onclick: closeSheet }, '취소'))
    ], null);
  }

  function openSettings() {
    var ac = S.settings.accentColor || '#1f6f5c';
    var demoChk = h('span', { class: 'demo-chk', 'aria-hidden': 'true' });
    function paintChk() { demoChk.style.background = ac; demoChk.style.color = textOn(ac); }
    paintChk();
    var cfAccent = colorField(ac, function (v) { ac = v; S.settings.accentColor = v; applyTheme(v); persist(); paintChk(); render(); });

    var pc = S.settings.pastColor;
    var demo = h('span', { class: 'circle' }, '3');
    function paintDemo() { demo.style.background = pc; demo.style.color = textOn(pc); }
    paintDemo();
    var cf = colorField(pc, function (v) { pc = v; S.settings.pastColor = v; persist(); paintDemo(); render(); });

    var ta = h('textarea', { id: 'backupBox', placeholder: '복원할 때는 백업 내용을 여기에 붙여넣으세요', 'aria-label': '백업 내용' });
    var msg = h('p', { class: 'msg', role: 'status' });
    var armed = false;
    var last = h('p', null, S.settings.lastBackup ? '마지막 백업: ' + S.settings.lastBackup : '아직 백업한 적이 없습니다.');
    var copyBtn = h('button', { type: 'button', onclick: function () {
      S.settings.lastBackup = todayStr(); persist();
      var json = JSON.stringify(S); ta.value = json;
      last.textContent = '마지막 백업: ' + S.settings.lastBackup;
      function fallback() { ta.focus(); ta.select(); msg.textContent = '복사가 막혀 있어 내용을 선택해 두었습니다. 직접 복사해 주세요.'; }
      try { navigator.clipboard.writeText(json).then(function () { msg.textContent = '백업을 복사했습니다. 메모장이나 메시지에 붙여 두세요.'; }, fallback); }
      catch (e) { fallback(); }
    } }, '백업 복사');
    var restoreBtn = h('button', { type: 'button', onclick: function () {
      var data = null;
      try { data = sanitize(JSON.parse(ta.value)); } catch (e) {}
      if (!data) { msg.textContent = '백업 내용을 읽을 수 없습니다. 복사한 내용 전체를 붙여넣었는지 확인해 주세요.'; armed = false; restoreBtn.textContent = '붙여넣은 내용으로 복원'; return; }
      if (!armed) { armed = true; restoreBtn.textContent = '복원 확인'; msg.textContent = '지금 데이터가 백업 내용으로 바뀝니다. 계속하려면 한 번 더 누르세요.'; return; }
      S = data; applyTheme(S.settings.accentColor); persist(); cursor = todayStr(); adding = null; render(); closeSheet();
    } }, '붙여넣은 내용으로 복원');

    openSheet([
      h('h2', null, '설정과 백업'),
      h('label', null, '포인트 색 (브이 표시·상단바·버튼)'),
      h('div', { style: 'display:flex;gap:14px;align-items:center;flex-wrap:wrap' }, demoChk, cfAccent),
      h('label', null, '지난 날짜 동그라미 색 (월간·주간)'),
      h('div', { style: 'display:flex;gap:14px;align-items:center;flex-wrap:wrap' }, demo, cf),
      h('h2', { style: 'margin-top:8px' }, '백업'),
      h('p', null, '데이터는 서버에 올라가지 않고 이 폰의 브라우저에만 저장됩니다. 브라우저 데이터를 지우거나 다른 주소로 옮기기 전에 백업을 복사해 두세요.'),
      last, ta, h('div', { class: 'btns' }, copyBtn, restoreBtn), msg,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'primary', onclick: closeSheet }, '닫기'))
    ]);
  }
  $('openSettings').addEventListener('click', openSettings);

  persist();
  render();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body></html>
